<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="An offline dial log, call queue, and sales scoreboard.">
  <title>Dial Console</title>
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./logic.js"></script>
  <script defer src="./db.js"></script>
  <script defer src="./scripts-seed.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to content</a>
  <div class="layout">
    <aside class="rail" id="rail"></aside>
    <div class="workspace" id="workspace">
      <header class="topbar" id="topbar"></header>
      <div class="notices" id="notices" aria-live="polite"></div>
      <main class="screen" id="screen" tabindex="-1"><p class="loading">Opening Dial Console…</p></main>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Main navigation"></nav>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title"></dialog>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <span class="key-prefix" id="key-prefix" hidden>g…</span>
</body>
</html>
